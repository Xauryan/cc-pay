[package]
name = "cc-pay-playwright"
version = "0.3.0"
edition = "2024"
description = "Optional Rust Playwright adapter for cc-pay"
readme = "README.md"
repository = "https://github.com/Xauryan/cc-pay"

[dependencies]
cc-pay = { path = "../..", version = "0.3.0" }
playwright-rs = { version = "=0.18.1", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde_json = "1"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
