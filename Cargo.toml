[package]
name = "cc-pay"
version = "0.2.0"
edition = "2024"
description = "CC-Pay campus cashier API: WeChat, Alipay and e-CNY wallet payments"
readme = "README.md"
repository = "https://github.com/Xauryan/cc-pay"
keywords = ["payment", "wechat", "alipay", "ecny", "api"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src/**", "/payment-worker/worker.ts", "/payment-worker/package.json", "/payment-worker/pnpm-lock.yaml", "/payment-worker/tsconfig.json", "/README.md", "/README.en.md", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "socks", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.24"
regex = "1"
url = "2"
chrono = "0.4"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
html-escape = "0.2"
encoding_rs = "0.8"
zeroize = "1"
libc = "0.2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
